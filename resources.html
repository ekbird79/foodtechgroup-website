<style>
  :root{
    --white:#FFFFFF; --paper:#F5F6F8; --ink:#1B1D2E; --ink-soft:#5B5E70;
    --navy:#2E2B83; --blue:#4E8FC7; --line:#E4E3E8;
    --pop:#14B8C9; --pop-soft:#E0F7FA; --pop-dark:#0E8E9C; --mint:#14B8C9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--white); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; line-height:1.6; overflow-x:hidden;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 32px; position:relative;}
  h1,h2,h3{font-family:'IBM Plex Sans', sans-serif; font-weight:700; color:var(--ink); letter-spacing:-0.01em;}
  p{color:var(--ink-soft);}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase;}

  /* ===== HEADER ===== */
  header{padding:20px 0; border-bottom:1px solid var(--line); position:relative; z-index:2; background:#fff;}
  header .wrap{display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:15px; color:var(--navy);}
  .navlinks{display:flex; gap:28px; font-size:13.5px; font-weight:600;}
  .navlinks a{color:var(--ink-soft);}
  .navlinks a.active{color:var(--navy);}
  .navcta{background:var(--navy); color:#fff; font-size:13px; font-weight:600; padding:11px 22px; border-radius:8px;}
  .navcta:hover{background:#211F63;}
  .logo img{height:42px;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .nav-linkedin{
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:#fff; background:var(--pop);
  }
  .nav-linkedin:hover{background:var(--pop-dark);}
  .nav-toggle{
    display:none; align-items:center; justify-content:center; width:36px; height:36px;
    background:none; border:none; cursor:pointer; color:var(--navy); padding:0;
  }
  .nav-toggle svg{width:22px; height:22px;}
  .nav-toggle .icon-close{display:none;}
  .nav-toggle.open .icon-burger{display:none;}
  .nav-toggle.open .icon-close{display:block;}

  /* ===== RESOURCES HEADING ===== */
  .resources-hero{padding:72px 0 28px; position:relative; overflow:hidden;}
  .hero-blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:0.55; z-index:0;}
  .resources-hero .wrap{z-index:1;}
  .resources-hero .eyebrow{color:var(--navy);}
  .resources-hero h1{font-size:40px; margin-top:12px;}

  /* ===== LISTING ===== */
  .resources-listing{padding:16px 0 100px;}

  /* Featured card */
  .article-card.featured{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:0; align-items:stretch;
    background:var(--navy); border-radius:22px; overflow:hidden; margin-bottom:48px;
    box-shadow:0 24px 50px rgba(27,29,46,0.18); cursor:pointer; position:relative;
  }
  .article-card.featured .card-body{padding:50px 46px; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:1;}
  .article-card.featured .card-tag{color:#8FE0BE; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .article-card.featured .card-tag svg{width:14px; height:14px;}
  .article-card.featured h2{color:#fff; font-size:30px; line-height:1.22; margin-bottom:14px;}
  .article-card.featured .read-more{
    color:#fff; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px;
  }
  .article-card.featured .card-visual{
    background:radial-gradient(circle at 30% 20%, #1B95A8 0%, var(--navy) 70%);
    display:flex; align-items:center; justify-content:center; position:relative; min-height:280px; overflow:hidden;
  }
  .article-card.featured .card-visual::before{
    content:""; position:absolute; inset:0; z-index:1;
    background-image:radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.5px);
    background-size:22px 22px; pointer-events:none;
  }
  .article-card.featured .visual-blob{position:absolute; border-radius:50%; opacity:0.5;}
  .article-card.featured .featured-photo{
    position:relative; z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 15%;
  }
  .article-card.featured .photo-fade{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(90deg, var(--navy) 0%, rgba(46,43,131,0.15) 35%, rgba(46,43,131,0) 60%);
  }
  .article-card.featured .icon-badge{
    position:relative; z-index:1; width:110px; height:110px; border-radius:28px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px);
  }
  .article-card.featured .icon-badge svg{width:56px; height:56px;}

  /* Standard cards */
  .article-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:24px;}
  .article-card.standard{
    background:#fff; border-radius:18px; overflow:hidden; cursor:pointer;
    box-shadow:0 6px 18px rgba(27,29,46,0.06); border:1px solid var(--line);
    display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s;
  }
  .article-card.standard:hover{transform:translateY(-4px); box-shadow:0 16px 34px rgba(27,29,46,0.13);}
  .article-card.standard .card-visual{
    height:270px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:var(--accent, var(--navy));
  }
  .article-card.standard .card-visual .blob-a{
    position:absolute; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.14);
    top:-50px; right:-30px;
  }
  .article-card.standard .card-visual .blob-b{
    position:absolute; width:70px; height:70px; border-radius:50%; background:rgba(0,0,0,0.10);
    bottom:-30px; left:-20px;
  }
  .article-card.standard .card-visual svg{width:44px; height:44px; position:relative; z-index:1;}
  .article-card.standard .card-visual .standard-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
  }
  .article-card.standard .card-body{padding:24px 26px 26px; display:flex; flex-direction:column; flex-grow:1;}
  .article-card.standard h3{font-size:17px; line-height:1.35; margin-bottom:16px; flex-grow:1;}
  .article-card.standard .read-more{
    color:var(--navy); font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:6px;
  }
  .read-more svg.arrow{width:14px; height:14px; transition:transform .15s;}
  .article-card:hover .read-more svg.arrow{transform:translateX(3px);}

  /* ===== ARTICLE DETAIL VIEW ===== */
  .article-view{padding:56px 0 110px; display:none;}
  .article-view.active{display:block;}
  .resources-listing.hidden{display:none;}
  .resources-hero.hidden{display:none;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
    color:var(--navy); margin-bottom:34px; cursor:pointer;
  }
  .back-link svg{width:14px; height:14px;}

  /* Article banner (colour / photo header) */
  .article-banner{
    position:relative; border-radius:22px; overflow:hidden; min-height:270px;
    display:flex; align-items:flex-end; margin-bottom:40px; background:var(--navy);
  }
  .article-banner.banner-top{align-items:flex-start;}
  .article-banner .banner-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 12%; z-index:0;
  }
  .article-banner .banner-pattern{
    position:absolute; inset:0; z-index:0;
    background-image:radial-gradient(rgba(255,255,255,0.16) 1.5px, transparent 2px);
    background-size:24px 24px;
  }
  .article-banner .banner-icon-wm{
    position:absolute; right:-10px; bottom:-30px; z-index:0; opacity:0.16;
  }
  .article-banner .banner-icon-wm svg{width:220px; height:220px;}
  .article-banner .banner-overlay-gradient{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.6) 100%);
  }
  .article-banner.banner-top .banner-overlay-gradient{
    background:linear-gradient(180deg, rgba(10,12,30,0.55) 0%, rgba(10,12,30,0.12) 45%, rgba(10,12,30,0) 70%);
  }
  .article-banner .banner-text{position:relative; z-index:2; padding:32px 40px 30px;}
  .article-banner .banner-text .eyebrow{color:#fff; opacity:0.9; text-shadow:0 1px 8px rgba(0,0,0,0.4);}
  .article-banner .banner-text h1{color:#fff; font-size:26px; line-height:1.25; margin-top:0; max-width:36ch; text-shadow:0 1px 10px rgba(0,0,0,0.4);}

  /* Banner style 2 — split icon panel */
  .article-banner.style-split{
    display:grid; grid-template-columns:140px 1fr; align-items:stretch; min-height:auto; background:none;
  }
  .style-split .split-icon-col{
    background:var(--accent); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .style-split .split-icon-col::before{
    content:""; position:absolute; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,0.14);
    top:-50px; left:-50px;
  }
  .style-split .split-icon-col svg{width:52px; height:52px; position:relative; z-index:1;}
  .style-split .split-text-col{
    background:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:30px 38px;
    border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .style-split .split-text-col .eyebrow{color:var(--accent);}
  .style-split .split-text-col h1{color:var(--ink); font-size:28px; line-height:1.25; margin-top:10px; max-width:26ch;}

  /* Banner style 3 — layered illustration */
  .article-banner.style-blobs{
    padding:42px 44px; align-items:center;
  }
  .style-blobs .blob{position:absolute; border-radius:50%; filter:blur(1px);}
  .style-blobs .blob-icon-badge{
    position:relative; z-index:2; width:76px; height:76px; border-radius:20px;
    background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
    backdrop-filter:blur(3px);
  }
  .style-blobs .blob-icon-badge svg{width:38px; height:38px;}
  .style-blobs .banner-text{padding:0; display:flex; flex-direction:column; align-items:flex-start;}

  .article-content{max-width:70ch;}
  .article-content .eyebrow{color:var(--navy); margin-bottom:16px;}
  .article-content h1{font-size:32px; line-height:1.2; margin-bottom:28px;}
  .article-content h3{font-size:19px; margin:34px 0 12px;}
  .article-content p{font-size:15.5px; margin-bottom:16px;}
  .article-content p.lede{font-size:17px; color:var(--ink); font-weight:600; margin-bottom:22px;}
  .article-content p.closer{
    font-size:16px; color:var(--ink); border-top:1px solid var(--line); padding-top:22px; margin-top:30px;
  }
  .article-content blockquote{
    font-size:17px; font-style:italic; color:var(--ink); border-left:3px solid var(--pop);
    padding:4px 0 4px 20px; margin:20px 0;
  }
  .article-content ul{list-style:none; padding-top:4px; margin-bottom:16px;}
  .article-content ul li{
    font-size:15px; line-height:1.6; color:var(--ink-soft); position:relative; padding:5px 0;
  }
  .article-content ul li::before{
    content:""; position:absolute; left:-16px; top:14px; width:7px; height:7px; border-radius:50%; background:var(--pop);
  }
  .article-content ul.further-info{
    background:var(--paper); border-radius:12px; padding:18px 22px 18px 38px; margin:8px 0 20px;
  }
  .article-content ul.further-info li{padding:5px 0;}
  .article-content ul.further-info li a{color:var(--navy); font-weight:600; text-decoration:underline; text-underline-offset:3px;}
  .article-content a{color:var(--navy); font-weight:600; text-decoration:underline; text-underline-offset:3px;}

  /* =====================================================
     Article body — colour bookends (pull-quote + closing block)
     ===================================================== */
  .article-content.body-style-spine blockquote{
    border-left:none; position:relative; background:var(--paper); border-radius:12px;
    padding:22px 24px 22px 58px; margin:24px 0;
  }
  .article-content.body-style-spine blockquote::before{
    content:"\201C"; position:absolute; left:18px; top:2px; font-size:52px; line-height:1;
    color:var(--body-accent); font-family:Georgia, serif; opacity:0.55;
  }
  .article-content.body-style-spine p.closer{
    border:none; background:var(--body-accent); color:#fff; padding:26px 28px; border-radius:14px; margin-top:36px;
  }
  .article-content.body-style-spine p.closer strong{color:#fff;}

  .bottom-back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
    color:var(--navy); margin-top:38px; cursor:pointer;
  }
  .bottom-back-link svg{width:14px; height:14px;}

  footer{padding:26px 0; font-size:13px; color:var(--ink-soft); text-align:center;}

  @media (max-width:900px){
    .nav-linkedin{display:none;}
    .nav-toggle{display:flex;}
    .navlinks{
      display:none; position:absolute; top:100%; left:0; right:0;
      flex-direction:column; gap:2px; background:#fff; padding:8px 32px 20px;
      border-bottom:1px solid var(--line); box-shadow:0 16px 24px -18px rgba(27,29,46,0.25);
    }
    .navlinks.open{display:flex;}
    .navlinks a{padding:12px 0; border-top:1px solid var(--line); font-size:15px;}
    .navlinks a:first-child{border-top:none;}
    .article-card.featured{grid-template-columns:1fr;}
    .article-card.featured .card-visual{min-height:160px;}
    .article-grid{grid-template-columns:1fr;}
  }
</style>
</head>

  <div class="wrap">

<script>
/* =========================================================================
   ARTICLE DATA
   -------------------------------------------------------------------------
   To add a new article later: add one object to this array.
   - featured: true  -> shown in the large showcase card (keep to one at a time)
   - order: controls position among the standard cards (lower = earlier)
   - accent: a CSS colour (or var(--navy) etc.) for that card's icon panel
   - icon: raw SVG string for the card's icon
   - contentHTML: the full article body, exactly as supplied
   Nothing else needs to change — the page renders whatever is in this array.
   ========================================================================= */

const icons = {
  aiShopping: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="4" y="3" width="12" height="18" rx="2"/><line x1="7" y1="7.5" x2="13" y2="7.5"/><line x1="7" y1="10.5" x2="13" y2="10.5"/><line x1="7" y1="13.5" x2="10.5" y2="13.5"/><circle cx="17.5" cy="16.5" r="4" stroke="#fff"/><path d="M20.3 19.3L22.5 21.5" stroke="#fff"/><path d="M17.5 14.3v1.1M17.5 17.7v1.1M15.9 16.5h1.1M19.1 16.5h1.1" stroke="#8FE0BE"/></svg>`,
  caffeine: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V9z"/><path d="M17 10.5h1.5a2.5 2.5 0 010 5H17"/><path d="M8 3c-.7 1 .7 1.6 0 2.6M12 3c-.7 1 .7 1.6 0 2.6" stroke-opacity="0.85"/></svg>`,

    photo: featuredPhoto,
    contentHTML: `
      <p>AI-powered shopping tools are increasingly being used to search for products, compare options and make recommendations based on factors such as ingredients, allergens, nutrition and dietary requirements.</p>
      <p>For food businesses, this creates another reason to get product information right.</p>
      <h3>Your label is becoming data</h3>
      <p>A food label has traditionally been designed to communicate information to the consumer from a physical pack. But that same information is now increasingly being captured, digitised and shared across retailer websites, product databases and other digital platforms.</p>
      <p>As AI becomes more involved in product discovery and purchasing decisions, this information may also be used by AI agents to determine which products to recommend.</p>
      <p>That makes having accurate, complete and consistent product information increasingly important.</p>
      <h3>Why regulatory accuracy matters</h3>
      <p>Imagine a consumer asking an AI shopping assistant:</p>
      <blockquote>&ldquo;Find me a gluten-free protein bar without dairy.&rdquo;</blockquote>
      <p>The answer will depend on the product information available to the system.</p>
      <p>If the allergen information is incomplete, the ingredients are out of date, the nutrition information doesn't match the current formulation, or a claim is being used incorrectly, the product may be misunderstood or excluded from the results.</p>
      <p>For food businesses, this creates another dimension to an issue that has always been important: the information available online about your product needs to accurately reflect the product on shelf.</p>
      <h3>The digital shelf needs a reliable source of truth</h3>
      <p>Changes to a formulation, ingredient, allergen declaration, nutrition information or claim need to be reflected consistently wherever product information is published.</p>
      <p>A discrepancy between the physical label and digital product information can create more than a data quality issue. It can result in consumer confusion, incorrect recommendations and potentially regulatory risk.</p>
      <p>This is why regulatory review remains important even as product information becomes increasingly digitised.</p>
      <p>AI systems can process and compare vast amounts of product information, but they rely on the information available to them being accurate and complete. If the underlying data is wrong, AI can only work with what it is given.</p>
      <p class="closer"><strong>Rubbish in, rubbish out.</strong></p>

    contentHTML: `
      <p>On 10 March 2026, the Food Standards Australia New Zealand (FSANZ) Board approved changes to the Australia New Zealand Food Standards Code introducing new rules for caffeine and guarana extract.</p>
      <p>The changes were gazetted on 9 June 2026, and businesses have two years from that date to comply with the new requirements.</p>
      <h3>Key changes</h3>
      <p>The changes include:</p>
      <ul>
        <li>Caffeine from any source cannot be added to food for retail sale unless specifically permitted by the Code.</li>
        <li>The retail sale of caffeine as a food will be prohibited.</li>
        <li>The retail sale of guarana extract with high caffeine concentrations will be restricted.</li>
        <li>High-caffeine packaged coffee beverages will have new caffeine declaration and advisory statement requirements.</li>
        <li>Caffeine will be permitted in formulated supplementary sports foods, subject to a <strong>maximum one-day quantity of 200 mg</strong>, concentration limits and new labelling and packaging requirements.</li>
      </ul>
      <p>Existing permissions for caffeine in products such as energy drinks and cola remain unchanged. Foods containing naturally occurring caffeine, such as coffee and tea, can also continue to be used, subject to applicable requirements, including the novel food provisions.</p>
      <h3>What does this mean for food businesses?</h3>
      <p>If you manufacture or are developing a product containing caffeine, now is a good time to check whether the use of caffeine is permitted for your particular food and what requirements apply.</p>
      <p>The answer isn't necessarily the same for every product. Different requirements can apply depending on the type of food, the source of caffeine and how it is used.</p>
      <p>There is also a specific transition arrangement for <strong>supplemented foods</strong> in New Zealand. MPI is currently considering the implications of the new caffeine rules for these products. During the two-year transition period, supplemented foods can continue to comply with the pre-existing requirements.</p>
      <h3>Where to find more information</h3>
      <ul class="further-info">
        <li><a href="https://www.foodstandards.gov.au/food-standards-code/proposals/p1056" target="_blank" rel="noopener">FSANZ – Proposal P1056: Caffeine Review</a></li>

      <p>MPI will provide further guidance on the changes to caffeine regulation in due course.</p>
      <p class="closer"><strong>If you're developing or reformulating a product containing caffeine, now is a good time to check which requirements apply to your product.</strong></p>

    contentHTML: `
      <p>In 2025, New Zealand Food Safety supported 57 consumer-level food recalls, with undeclared allergens accounting for 26 of them.</p>
      <p><a href="https://www.mpi.govt.nz/dmsdocument/72116/direct" target="_blank" rel="noopener">MPI – Consumer-level food recalls annual report 2025</a></p>
      <p>Things can go wrong in any food business. A recall can result from many different issues, including undeclared allergens, microbiological contamination, foreign matter, a labelling error, process failure or a problem with an ingredient or supplier.</p>
      <h3>Would you know what to do?</h3>
      <p>When a potential food safety issue is identified, decisions may need to be made quickly.</p>
      <p>Can you identify the affected products and batches? Can you trace where they were distributed and who received them? Can you provide the information needed to assess the risk and determine what action is required?</p>
      <p>These questions are much easier to answer when your traceability and recall systems have been tested before you need them.</p>
      <h3>Mock recalls aren't just a paperwork exercise</h3>
      <p>For businesses with a plan or programme under the Food Act, Wine Act and Animal Products Act, as well as food importers and exporters, a simulated recall must be conducted at least every 12 months, unless a genuine recall in the previous 12 months demonstrated that the business's traceability and recall procedures were effective.</p>
      <p><a href="https://www.mpi.govt.nz/food-business/food-recalls/doing-food-recall" target="_blank" rel="noopener">MPI – How to do a simulated (mock) food recall</a></p>
      <p>Completing an annual mock recall shouldn't simply be about ticking a regulatory box.</p>
      <p>A well-run exercise can expose gaps that aren't obvious from having a written recall procedure - such as incomplete records, poor batch identification, gaps in traceability or difficulty identifying who received an affected product.</p>
      <h3>What if you're a brand owner?</h3>
      <p>If you sell food under your own brand but use a contract manufacturer, don't assume recall responsibility sits entirely with the manufacturer.</p>
      <p>New Zealand Food Safety (NZFS) recommends that manufacturers and brand owners agree in advance on their respective roles and responsibilities. This can include who investigates the issue, who assesses the risk, who makes the recall decision, who communicates with MPI, and who communicates with retailers and consumers.</p>
      <p><a href="https://www.mpi.govt.nz/food-business/food-recalls/food-recall-guidance-for-businesses/food-recall-insurance-and-recalling-third-party-branded-products" target="_blank" rel="noopener">MPI – Recalling third-party branded products</a></p>
      <p>Even where the annual simulated recall requirement does not apply directly to the brand owner, you still need to know what would happen if your product had to be recalled. Agreeing roles and responsibilities with your manufacturer before an incident occurs can make a significant difference.</p>

    contentHTML: `
      <p>Plain English Allergen Labelling (PEAL) requirements have now been in place for more than two years, and the sell-through period for stock in trade ended on 25 February 2026.</p>
      <p>Yet non-compliant allergen declarations can still be found on food labels today.</p>
      <p>If you're launching a new product, updating existing artwork or reviewing your current labels, it's important to check that your allergen declarations meet the current requirements of the Australia New Zealand Food Standards Code.</p>
      <h3>What changed?</h3>
      <p>PEAL was introduced to make allergen information on food labels clearer and easier for consumers to find and understand.</p>
      <p>The requirements include:</p>
      <ul>
        <li>using specified names for allergens</li>
        <li>bolding allergen declarations in the statement of ingredients</li>
        <li>providing a separate, bold allergen summary beginning with &ldquo;Contains&rdquo;</li>
        <li>declaring certain allergens individually rather than using broader category terms.</li>
      </ul>
      <p>The new requirements applied from 25 February 2024. Food packaged and labelled before that date and compliant with the previous requirements could continue to be sold until 25 February 2026. That transition period has now ended.</p>
      <h3>What can go wrong?</h3>
      <p>When it comes to allergen labelling, there is no room for artistic licence. The Food Code specifies how allergens must be named and declared.</p>
      <p>Some common issues I come across include:</p>
      <ul>
        <li>allergens not being identified using the required names</li>
        <li>missing or incorrectly formatted &ldquo;Contains&rdquo; statements</li>
        <li>broad terms being used instead of individual allergen names, such as declaring &ldquo;tree nuts&rdquo; rather than the specific nut present</li>
        <li>incorrect declarations relating to cereals containing gluten</li>
        <li>allergen information on the label not matching the formulation or current supplier specifications.</li>
      </ul>
      <p>These issues can be easy to miss, particularly where ingredient specifications use technical terminology or where a product has been reformulated or a supplier has changed.</p>
      <h3>A useful industry guide</h3>
      <p>The Food Industry Guide to Allergen Management and Labelling for Australia and New Zealand (FIGAML) is a useful industry resource developed by the Australian Food and Grocery Council and the Allergen Bureau. The current guide was updated in December 2024 and provides guidance on allergen management, labelling and communication.</p>
      <p><a href="https://allergenbureau.net/industry-guidance/" target="_blank" rel="noopener">https://allergenbureau.net/industry-guidance/</a></p>
      <h3>What about &ldquo;May contain&rdquo; statements?</h3>
      <p>Precautionary allergen labelling (PAL), such as &ldquo;May contain milk&rdquo; or &ldquo;May be present: peanut&rdquo;, is voluntary and is not prescribed by the Food Standards Code.</p>
      <p>Where PAL is used, it should be based on risk assessment. We recommend following recognised industry guidance, such as FIGAML and the Allergen Bureau's VITAL program, when assessing and managing this risk.</p>
      <h3>Is your label compliant?</h3>
      <p>The PEAL transition period has now ended. Food businesses should not rely on guesswork or legacy artwork when reviewing or creating new labels.</p>
      <p>If you're unsure whether your allergen declarations meet the current requirements, a label review can help identify issues before artwork is finalised or labels are printed. Taking the time to check can help avoid a costly mistake.</p>
      <p class="closer">Need help reviewing a food label? Get in touch.</p>
    `

    contentHTML: `
      <p class="lede">Thinking about putting a gluten free claim on your food product?</p>
      <p>For consumers with coeliac disease, consuming gluten can have serious health consequences. A gluten free claim on a label tells them that the food is suitable for them to eat. It is not simply a marketing claim.</p>
      <p>For businesses, this means understanding where gluten could enter the product and having appropriate controls in place to prevent this from happening. Getting it wrong can result in costly recalls, relabelling, reputational damage and, most importantly, harm to consumers.</p>
      <h3>Naturally gluten free doesn't always mean suitable for a gluten free claim</h3>
      <p>Many ingredients are naturally gluten free, but that does not automatically mean they are suitable for use in a product labelled gluten free.</p>
      <p>Cross-contact with gluten can occur during growing, harvesting, transport, storage or processing. Herbs and spices are a good example, as they may pass through multiple suppliers and processing or packing facilities before reaching the end user.</p>
      <p>Businesses should understand how ingredients have been sourced and processed before making a gluten free claim.</p>
      <h3>Know your suppliers</h3>
      <p>Your supplier and raw material approval processes are important controls when sourcing ingredients for a gluten free product.</p>
      <p>Before approving an ingredient or supplier, consider obtaining:</p>
      <ul>
        <li>a current product specification, including detailed allergen information</li>
        <li>information about gluten and allergen management practices</li>
        <li>details of shared equipment or production lines</li>
        <li>information about how changes to ingredients or manufacturing processes are communicated.</li>
      </ul>
      <p>Supplier documentation provides an important starting point, but shouldn't be accepted without question. Businesses need to understand whether the controls used by their suppliers are sufficient to support making a gluten free claim.</p>
      <h3>Managing cross-contact risks</h3>
      <p>Even when ingredients are naturally gluten free, gluten cross-contact can occur during storage, handling and processing.</p>
      <p>Effective controls may include:</p>
      <ul>
        <li>good housekeeping and hygiene practices</li>
        <li>segregation of gluten-containing materials</li>
        <li>production scheduling to minimise risk of cross-contact</li>
        <li>validated cleaning procedures</li>
        <li>clear identification of materials</li>
        <li>staff training.</li>
      </ul>
      <p>These controls should form part of the business's food safety programme and be routinely verified to ensure they are effective.</p>
      <h3>Verification is more than product testing</h3>
      <p>Testing can play an important role in verifying a product is gluten free, but it shouldn't be relied upon as the sole evidence to support a claim. After all, product testing is only a tiny snapshot of reality, based on the samples tested.</p>
      <p>Verification of a gluten free claim should be risk-based, with the type and frequency of verification reflecting the ingredients, processes and potential sources of gluten.</p>
      <p>Where analytical testing is used, it should be carried out by an accredited laboratory using an accredited test method appropriate for the food being tested.</p>
      <h3>Not all gluten free claims are equal</h3>
      <p>Businesses sourcing imported ingredients or finished products should be aware that the definition of gluten free differs around the world.</p>
      <p>Many countries permit foods containing up to 20 mg/kg (20 ppm) of gluten to be labelled gluten free. New Zealand has a stricter requirement. Under the Australia New Zealand Food Standards Code, foods labelled gluten free must contain <strong>no detectable gluten</strong> and must not contain oats or oat products, or cereals containing gluten that have been malted, or their products.</p>
      <p>A product that is labelled gluten free overseas may therefore not meet New Zealand's requirements.</p>
      <h3>Gluten free claims and the Nutrition Information Panel</h3>
      <p>For retail-ready packaged food, gluten must be included in the Nutrition Information Panel (NIP) when a gluten free claim is made.</p>
      <p>Different labelling requirements may apply to food supplied to other businesses, such as caterers or food service operators, so consider how and where the product will be sold.</p>
      <h3>Questions to ask before making a gluten free claim</h3>
      <p>Before launching a product with a gluten free claim, ask:</p>
      <ul>
        <li>Do my ingredients inherently contain any gluten?</li>
        <li>Do I understand how my ingredients have been sourced and processed?</li>
        <li>Have I assessed the risk of gluten cross-contact throughout the supply chain?</li>
        <li>Do I have sufficient information from my suppliers to support the claim?</li>
        <li>Does the product comply with New Zealand's definition of gluten free?</li>
      </ul>
      <p class="closer">Taking the time to check these things before a product reaches the market can help protect consumers, reduce business risk and avoid costly recalls or relabelling.</p>
    `
  }
];

/* =========================================================================
   RENDERING — nothing below here needs to change when articles are added
   ========================================================================= */
const arrowIcon = `<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;
const sparkIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.3 4.2L17.5 8l-4.2 1.3L12 13.5l-1.3-4.2L6.5 8l4.2-1.8L12 2z"/></svg>`;

function renderListing(){
  const featured = articles.find(a => a.featured);
  const standard = articles.filter(a => !a.featured).sort((a,b) => a.order - b.order);

  let html = "";

  if (featured){
    html += `
      <div class="article-card featured" data-slug="${featured.slug}">
        <div class="card-body">
          <div class="eyebrow card-tag">${sparkIcon} Featured</div>
          <h2>${featured.title}</h2>
          <span class="read-more">Read article ${arrowIcon}</span>
        </div>
        <div class="card-visual">
          <img class="featured-photo" src="${featuredPhoto}" alt="A robot shopping with a trolley, representing AI-assisted grocery shopping">
          <div class="photo-fade"></div>
        </div>
      </div>`;
  }

  html += `<div class="article-grid">`;
  standard.forEach(a => {
    html += `
      <div class="article-card standard" data-slug="${a.slug}">
        <div class="card-visual" style="--accent:${a.accent};">
          <img class="standard-photo" src="${a.photo}" alt=""${a.photoFocus ? ` style="object-position:${a.photoFocus};"` : ""}>
        </div>
        <div class="card-body">
          <h3>${a.title}</h3>
          <span class="read-more">Read article ${arrowIcon}</span>
        </div>
      </div>`;
  });
  html += `</div>`;

  document.getElementById("listing-grid").innerHTML = html;

  document.querySelectorAll(".article-card").forEach(card => {
    card.addEventListener("click", () => openArticle(card.dataset.slug));
  });
}

let bannerStyle = "blobs"; // "gradient" | "split" | "blobs" (photo articles always use their own photo banner)
const bodyStyle = "spine"; // locked in — the only body treatment kept after feedback

function buildBanner(article){
  const textBlock = `<h1>${article.title}</h1>`;

  if (article.photo){
    const focusStyle = article.photoFocus ? ` style="object-position:${article.photoFocus};"` : "";
    const bannerClass = article.bannerTextTop ? "article-banner banner-top" : "article-banner";
    return `
      <div class="${bannerClass}">
        <img class="banner-photo" src="${article.photo}" alt=""${focusStyle}>
        <div class="banner-overlay-gradient"></div>
        <div class="banner-text">${textBlock}</div>
      </div>`;
  }

  if (bannerStyle === "split"){
    return `
      <div class="article-banner style-split">
        <div class="split-icon-col" style="--accent:${article.accent};">${article.icon}</div>
        <div class="split-text-col">${textBlock}</div>
      </div>`;
  }

  if (bannerStyle === "blobs"){
    return `
      <div class="article-banner style-blobs" style="background:linear-gradient(150deg, ${article.accent} 0%, var(--navy) 75%);">
        <div class="blob" style="width:220px; height:220px; background:rgba(255,255,255,0.10); top:-90px; right:-40px;"></div>
        <div class="blob" style="width:150px; height:150px; background:rgba(0,0,0,0.12); bottom:-60px; left:20%;"></div>
        <div class="blob" style="width:110px; height:110px; background:rgba(255,255,255,0.14); bottom:20px; right:18%;"></div>
        <div class="banner-overlay-gradient"></div>
        <div class="banner-text">
          <div class="blob-icon-badge">${article.icon}</div>
          ${textBlock}
        </div>
      </div>`;
  }

  // default: bold gradient
  return `
    <div class="article-banner" style="background:linear-gradient(135deg, ${article.accent} 0%, var(--navy) 100%);">
      <div class="banner-pattern"></div>
      <div class="banner-icon-wm">${article.icon}</div>
      <div class="banner-overlay-gradient"></div>
      <div class="banner-text">${textBlock}</div>
    </div>`;
}

function openArticle(slug){
  const article = articles.find(a => a.slug === slug);
  if (!article) return;
  const contentEl = document.getElementById("article-content");
  contentEl.innerHTML = buildBanner(article) + article.contentHTML;
  contentEl.className = "article-content body-style-" + bodyStyle;
  contentEl.style.setProperty("--body-accent", article.accent);
  document.getElementById("resources-hero").classList.add("hidden");
  document.getElementById("resources-listing").classList.add("hidden");
  document.getElementById("article-view").classList.add("active");
  window.scrollTo(0,0);
  location.hash = slug;
}

function closeArticle(){
  document.getElementById("resources-hero").classList.remove("hidden");
  document.getElementById("resources-listing").classList.remove("hidden");
  document.getElementById("article-view").classList.remove("active");
  window.scrollTo(0,0);
  history.replaceState(null, "", location.pathname);
}

document.getElementById("back-link").addEventListener("click", closeArticle);
document.getElementById("back-link-bottom").addEventListener("click", closeArticle);

// Mobile nav toggle
const navToggle = document.getElementById("nav-toggle");
const navLinks = document.getElementById("navlinks");
if (navToggle && navLinks) {
  navToggle.addEventListener("click", function() {
    const isOpen = navLinks.classList.toggle("open");
    navToggle.classList.toggle("open", isOpen);
    navToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  navLinks.querySelectorAll("a").forEach(function(link) {
    link.addEventListener("click", function() {
      navLinks.classList.remove("open");
      navToggle.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    });
  });
}

renderListing();
if (location.hash) {
  const slug = location.hash.replace("#","");
  if (articles.find(a => a.slug === slug)) openArticle(slug);
}

// GA4 click tracking: LinkedIn link and Get in touch CTA button
function trackClick(selector, eventName, params) {
  document.querySelectorAll(selector).forEach(function(el) {
    el.addEventListener('click', function() {
      if (typeof gtag === 'function') {
        gtag('event', eventName, params || {});
      }
    });
  });
}
trackClick('.nav-linkedin', 'social_click', { platform: 'linkedin' });
trackClick('.navcta', 'cta_click', { location: 'header' });
</script>
